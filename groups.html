<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups to Join</title>

    <link rel="stylesheet" href="style.css">


    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="p-3">
    <h1 class="text-2xl flex items-center gap-3 font-semibold"><a href="index.html"><i class="fa-solid fa-arrow-left" id="bTH"></i></a>Groups to Join</h1>

    <p class="mt-3 text-gray-500">
        Here are some groups you can join to stay upadated on campus events, 
        find study partners, and make new friends.
    </p>

    <div class="flex flex-col items-center gap-3 mt-5 " id="group-list"></div>
        

    <!-- tailwind cdn link -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- font awesome link -->
    <script src="https://kit.fontawesome.com/ecf01ca8f4.js" crossorigin="anonymous"></script>

    <script>
        fetch('group.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network responses is not ok")
                }

                return response.json();
            })
            .then(data => {
                const groupList = document.getElementById('group-list');
                groupList.innerHTML = '';
                const faculties = data.faculty;

                faculties.forEach(item => {
                    const faculty = document.createElement('div');
                    faculty.className = `p-5 shadow w-full rounded-2xl border border-gray-400/20`;

                    faculty.innerHTML = `
                        <a href="${item.link}">
                            <h2 class="text-lg font-semibold">${item.group}</h2>

                            <div class="flex items-center justify-between mt-2 gap-3">
                                <span class="text-sm text-gray-500 italic">${item.type}</span>
                            </div>
                        </a>
                    `

                    groupList.appendChild(faculty);
                })
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            })
    </script>
</body>
</html>
