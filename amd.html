<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Accomodation</title>

    <link rel="stylesheet" href="style.css">

    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="p-3">
    <h1 class="text-2xl flex items-center gap-3 font-semibold"><a href="index.html"><i class="fa-solid fa-arrow-left" id="bTH"></i></a>Find Accomodation</h1>

    <p class="mt-3 text-gray-500">Here are some agents that can help you find accommodation:
        click on them to message them on WhatsApp.
    </p>

    <div class="flex flex-col mt-5 gap-3 items-center w-full" id="agent-list">

    </div>


    <!-- tailwind cdn link -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- font awesome link -->
    <script src="https://kit.fontawesome.com/ecf01ca8f4.js" crossorigin="anonymous"></script>

    <script>
        fetch('group.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const agentList = document.getElementById('agent-list');
                agentList.innerHTML = ''; 
                const agents = data.agents;

                agents.forEach(item => {
                    const agent = document.createElement('div');
                    agent.className = `p-5 shadow w-full rounded-2xl border border-gray-400/20`;
                    
                    agent.innerHTML = `
                        <a href="${item.link}">
                            <h2>${item.agent}</h2>

                            <div class="flex gap-3 mt-3 font-light mt-2 text-gray-400 items-center ">
                                <p class="text-sm italic">Rating: <span class="${item.rating >= 4 ? "text-green-600" : "text-red-600"}"><i class="fa-solid fa-star"></i>${item.rating}</span></p>
                                <p>|</p>
                                <p class="text-sm  italic">Office: ${item.office}</p>
                            </div>    
                        </a>
                    `
                    agentList.appendChild(agent);
                })
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            })
    </script>
</body>
</html>
